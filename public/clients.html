<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clientes | Sistema</title>

    <!-- Bootstrap 5 CSS & Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <div id="app-layout">
      <!-- Componente Sidebar -->
      <aside id="sidebar-container"></aside>

      <div id="main-wrapper">
        <!-- Componente Navbar -->
        <header id="navbar-container"></header>

        <main class="main-content">
          <!-- Cabeçalho da Página -->
          <div
            class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4"
          >
            <div>
              <h3 class="fw-bold mb-1">Clientes</h3>
              <p class="text-muted mb-0">
                Gerencie a base de contatos e histórico de clientes cadastrados.
              </p>
            </div>
            <button
              class="btn btn-coral px-3 py-2 rounded-3"
              data-bs-toggle="modal"
              data-bs-target="#modalCliente"
            >
              <i class="bi bi-plus-lg me-1"></i> Adicionar Cliente
            </button>
          </div>

          <!-- Filtros e Busca -->
          <div class="custom-card mb-4">
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0">
                    <i class="bi bi-search text-muted"></i>
                  </span>
                  <input
                    type="text"
                    id="input-search"
                    class="form-control border-start-0"
                    placeholder="Buscar por nome, telefone ou e-mail..."
                  />
                </div>
              </div>
              <div class="col-6 col-md-3 text-end">
                <button id="btn-filter" class="btn btn-light border w-100">
                  <i class="bi bi-funnel me-1"></i> Filtrar
                </button>
              </div>
            </div>
          </div>

          <div class="custom-card">
            <div id="clients-view-container"></div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/assets/layout.js"></script>
    <script type="module" src="/js/clients/clients.js"></script>
  </body>
</html>
