<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clientes | Sistema</title>

    <!-- Bootstrap 5 CSS & Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <div id="app-layout">
      <!-- Componente Sidebar injetado aqui -->
      <aside id="sidebar-container"></aside>

      <div id="main-wrapper">
        <!-- Componente Navbar injetado aqui -->
        <header id="navbar-container"></header>

        <main class="main-content">
          <!-- Cabeçalho da Página -->
          <div
            class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4"
          >
            <div>
              <h3 class="fw-bold mb-1">Clientes</h3>
              <p class="text-muted mb-0">
                Gerencie a base de contatos e histórico de clientes cadastrados.
              </p>
            </div>
            <button
              class="btn btn-coral px-3 py-2 rounded-3"
              data-bs-toggle="modal"
              data-bs-target="#modalCliente"
            >
              <i class="bi bi-plus-lg me-1"></i> Adicionar Cliente
            </button>
          </div>

          <!-- Filtros e Busca -->
          <div class="custom-card mb-4">
            <div class="row g-3">
              <div class="col-12 col-md-6">
                <div class="input-group">
                  <span class="input-group-text bg-white border-end-0"
                    ><i class="bi bi-search text-muted"></i
                  ></span>
                  <input
                    type="text"
                    id="input-search"
                    class="form-control border-start-0"
                    placeholder="Buscar por nome, telefone ou e-mail..."
                  />
                </div>
              </div>
              <div class="col-6 col-md-3">
                <select id="filter-status" class="form-select">
                  <option value="">Todos os status</option>
                  <option value="ativo">Ativos</option>
                  <option value="inativo">Inativos</option>
                </select>
              </div>
              <div class="col-6 col-md-3 text-end">
                <button id="btn-filter" class="btn btn-light border w-100">
                  <i class="bi bi-funnel me-1"></i> Filtrar
                </button>
              </div>
            </div>
          </div>

          <!-- Tabela / Lista de Clientes -->
          <div class="custom-card">
            <div class="table-responsive">
              <table class="table align-middle table-hover mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th>Status</th>
                    <th class="text-end">Ações</th>
                  </tr>
                </thead>
                <tbody id="clientes-tbody"></tbody>
              </table>
            </div>

            <!-- Estado Vazio (Oculto por padrão) -->
            <div id="empty-state" class="text-center py-5 d-none">
              <i class="bi bi-people text-muted display-4"></i>
              <p class="mt-3 text-muted">
                Nenhum cliente cadastrado ou encontrado no filtro.
              </p>
            </div>

            <!-- Estado Carregando -->
            <div id="loading-state" class="text-center py-5">
              <div class="spinner-border text-danger" role="status"></div>
              <p class="mt-2 text-muted small">Carregando registros...</p>
            </div>

            <!-- Paginação -->
            <div class="d-flex justify-content-between align-items-center mt-4">
              <span class="small text-muted"
                >Exibindo <b id="current-count">0</b> de
                <b id="total-count">0</b> registros</span
              >
              <ul class="pagination pagination-sm mb-0">
                <li class="page-item disabled">
                  <a class="page-link" href="#">Anterior</a>
                </li>
                <li class="page-item active">
                  <a class="page-link bg-danger border-danger" href="#">1</a>
                </li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item">
                  <a class="page-link" href="#">Próximo</a>
                </li>
              </ul>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/assets/layout.js"></script>
  </body>
</html>
